name: Build Android Gateway

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "gateway/**"
      - ".github/workflows/build-gateway.yml"

jobs:
  gateway:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Compile-check gateway
        working-directory: gateway
        run: bun run check

      - name: Smoke-test gateway
        run: bash gateway/test/smoke.sh

      - name: Build gateway container
        run: docker build -t bciandroid-live-gateway:ci gateway
