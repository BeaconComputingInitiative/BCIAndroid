name: Build Android Gateway

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "gateway/**"
      - "render.yaml"
      - ".github/workflows/build-gateway.yml"
  pull_request:
    paths:
      - "gateway/**"
      - "render.yaml"
      - ".github/workflows/build-gateway.yml"

jobs:
  gateway:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Compile-check gateway
        working-directory: gateway
        run: bun run check

      - name: BCI source integrity
        shell: bash
        run: |
          set -euo pipefail
          echo "BEACON COMPUTING INITIATIVE"
          echo "Developer Seal: CJB-DEV-2026"
          sha256sum \
            gateway/src/server.ts \
            gateway/Dockerfile \
            gateway/package.json \
            render.yaml

      - name: Smoke-test gateway
        run: bash gateway/test/smoke.sh

      - name: Build gateway container
        run: docker build -t bciandroid-live-gateway:ci gateway
