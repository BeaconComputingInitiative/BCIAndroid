name: Build Android Gateway

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "gateway/**"
      - "render.yaml"
      - "scripts/verify-module-contracts.py"
      - "contracts/**"
      - ".github/workflows/build-gateway.yml"
  pull_request:
    paths:
      - "gateway/**"
      - "render.yaml"
      - "scripts/verify-module-contracts.py"
      - "contracts/**"
      - ".github/workflows/build-gateway.yml"

jobs:
  gateway:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Cross-module compatibility contracts
        run: python3 scripts/verify-module-contracts.py

      - name: Compile-check gateway
        working-directory: gateway
        run: bun run check

      - name: BCI source integrity
        shell: bash
        run: |
          set -euo pipefail
          echo "BEACON COMPUTING INITIATIVE"
          echo "Developer Seal: CJB-DEV-2026"
          sha256sum \
            gateway/src/server.ts \
            gateway/Dockerfile \
            gateway/package.json \
            gateway/test/smoke.sh \
            gateway/test/publish-transcript.ts \
            render.yaml \
            scripts/verify-module-contracts.py \
            contracts/bci-core-v1.json \
            contracts/BCI_CORE_CONTRACT_V1.md

      - name: Smoke-test gateway
        run: bash gateway/test/smoke.sh

      - name: Build gateway container
        run: docker build -t bciandroid-live-gateway:ci gateway
