name: Build Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "vendor/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".gitmodules"
      - ".github/workflows/build-android.yml"
  pull_request:
    paths:
      - "app/**"
      - "vendor/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".gitmodules"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK manager
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -perm -u+x 2>/dev/null | head -1 || true)"
          fi
          test -n "$SDKMANAGER"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platforms;android-36"             "build-tools;36.0.0"             "ndk;25.2.9519653"             "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Bundle whisper.cpp tiny.en model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/models
          curl -fL --retry 4             https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin             -o app/src/main/assets/models/ggml-tiny.en.bin
          test "$(stat -c%s app/src/main/assets/models/ggml-tiny.en.bin)" -gt 1000000

      - name: BCI source integrity
        shell: bash
        run: |
          set -euo pipefail
          echo "BEACON COMPUTING INITIATIVE"
          echo "Developer Seal: CJB-DEV-2026"
          sha256sum \
            app/src/main/java/org/beaconcomputinginitiative/bciwhisper/MainActivity.kt \
            app/src/main/java/org/beaconcomputinginitiative/bciwhisper/audio/AudioMonitorService.kt \
            app/src/main/java/org/beaconcomputinginitiative/bciwhisper/audio/NativeAudioEngine.kt \
            app/src/main/java/org/beaconcomputinginitiative/bciwhisper/audio/DetectionEngine.kt \
            app/src/main/java/org/beaconcomputinginitiative/bciwhisper/audio/EventRecorder.kt \
            app/src/main/java/org/beaconcomputinginitiative/bciwhisper/audio/RecordingActivityTimeline.kt \
            app/src/main/java/org/beaconcomputinginitiative/bciwhisper/audio/VoiceIsolationProcessor.kt \
            app/src/main/java/org/beaconcomputinginitiative/bciwhisper/transcription/TranscriptionAudioPlanner.kt \
            app/src/main/java/org/beaconcomputinginitiative/bciwhisper/transcription/PhoneticReconstructionEngine.kt \
            app/src/main/java/org/beaconcomputinginitiative/bciwhisper/transcription/SpeakerDiarizer.kt \
            app/src/main/java/org/beaconcomputinginitiative/bciwhisper/transcription/TranscriptionEngine.kt \
            app/src/main/java/org/beaconcomputinginitiative/bciwhisper/transcription/TranscriptionQualityGate.kt \
            app/src/main/java/org/beaconcomputinginitiative/bciwhisper/transcription/NativeTranscriptionEngine.kt \
            app/src/main/java/org/beaconcomputinginitiative/bciwhisper/transcription/LiveTranscriptionEngine.kt \
            app/src/main/java/org/beaconcomputinginitiative/bciwhisper/transcription/LiveTranscriptDeduplicator.kt \
            app/src/main/java/org/beaconcomputinginitiative/bciwhisper/ui/Spectrum3DView.kt \
            app/src/main/cpp/whisper/native_engine.cpp \
            app/src/main/cpp/whisper/audio_engine.cpp \
            app/src/main/cpp/whisper/CMakeLists.txt \
            app/src/main/java/org/beaconcomputinginitiative/bciwhisper/broadcast/BroadcastConfig.kt \
            app/src/main/java/org/beaconcomputinginitiative/bciwhisper/broadcast/BroadcastPublisher.kt \
            app/src/main/java/org/beaconcomputinginitiative/bciwhisper/broadcast/PublisherCredentialStore.kt \
            app/build.gradle.kts

      - name: Native architecture invariant
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q "WhisperNative" app/src/main/java/org/beaconcomputinginitiative/bciwhisper/transcription/TranscriptionEngine.kt
          ! grep -q "sharedContextPtr" app/src/main/java/org/beaconcomputinginitiative/bciwhisper/transcription/TranscriptionEngine.kt
          ! grep -q "resampleTo16k" app/src/main/java/org/beaconcomputinginitiative/bciwhisper/transcription/TranscriptionEngine.kt
          grep -q "NativeTranscriptionEngine" app/src/main/java/org/beaconcomputinginitiative/bciwhisper/transcription/TranscriptionEngine.kt
          grep -q "native_engine.cpp" app/src/main/cpp/whisper/CMakeLists.txt
          grep -q "audio_engine.cpp" app/src/main/cpp/whisper/CMakeLists.txt
          grep -q "oboe::oboe" app/src/main/cpp/whisper/CMakeLists.txt
          grep -q "com.google.oboe:oboe:1.11.0" app/build.gradle.kts
          grep -q "NativeAudioEngine" app/src/main/java/org/beaconcomputinginitiative/bciwhisper/audio/AudioMonitorService.kt
          ! grep -q "AudioRecord" app/src/main/java/org/beaconcomputinginitiative/bciwhisper/audio/AudioMonitorService.kt
          grep -q "GLSurfaceView" app/src/main/java/org/beaconcomputinginitiative/bciwhisper/ui/Spectrum3DView.kt
          grep -q "GLES20" app/src/main/java/org/beaconcomputinginitiative/bciwhisper/ui/Spectrum3DView.kt
          grep -q "LiveTranscriptionEngine" app/src/main/java/org/beaconcomputinginitiative/bciwhisper/audio/AudioMonitorService.kt
          grep -q "submitTranscript" app/src/main/java/org/beaconcomputinginitiative/bciwhisper/broadcast/BroadcastPublisher.kt
          grep -q "transcribeLivePcm" app/src/main/java/org/beaconcomputinginitiative/bciwhisper/transcription/TranscriptionEngine.kt

      - name: Run JVM regression tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null

          AAPT="$SDK_ROOT/build-tools/36.0.0/aapt"
          test -x "$AAPT"

          "$AAPT" dump badging "$APK" | tee /tmp/bci-badging.txt
          grep -q "package: name='org.beaconcomputinginitiative.bciwhisper'" /tmp/bci-badging.txt
          grep -q "application-label:'BCIWhisper'" /tmp/bci-badging.txt

          "$AAPT" dump permissions "$APK" | tee /tmp/bci-permissions.txt

          grep -q "android.permission.RECORD_AUDIO" /tmp/bci-permissions.txt
          grep -q "android.permission.INTERNET" /tmp/bci-permissions.txt
          grep -q "android.permission.ACCESS_NETWORK_STATE" /tmp/bci-permissions.txt
          grep -q "android.permission.FOREGROUND_SERVICE" /tmp/bci-permissions.txt
          grep -q "android.permission.FOREGROUND_SERVICE_MICROPHONE" /tmp/bci-permissions.txt
          grep -q "android.permission.MODIFY_AUDIO_SETTINGS" /tmp/bci-permissions.txt
          grep -q "android.permission.BLUETOOTH_CONNECT" /tmp/bci-permissions.txt

          ! grep -q "ACCESS_FINE_LOCATION" /tmp/bci-permissions.txt
          ! grep -q "ACCESS_COARSE_LOCATION" /tmp/bci-permissions.txt
          ! grep -q "BLUETOOTH_SCAN" /tmp/bci-permissions.txt
          ! grep -q "READ_CONTACTS" /tmp/bci-permissions.txt
          ! grep -q "CAMERA" /tmp/bci-permissions.txt
          ! grep -q "READ_SMS" /tmp/bci-permissions.txt
          ! grep -q "READ_PHONE_STATE" /tmp/bci-permissions.txt
          ! grep -q "READ_MEDIA_" /tmp/bci-permissions.txt
          ! grep -q "READ_EXTERNAL_STORAGE" /tmp/bci-permissions.txt
          ! grep -q "WRITE_EXTERNAL_STORAGE" /tmp/bci-permissions.txt
          ! grep -q "POST_NOTIFICATIONS" /tmp/bci-permissions.txt

          sha256sum "$APK"

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk             out/BCIWhisper-v6.0-Android-alpha18-debug.apk
          (
            cd out
            sha256sum BCIWhisper-v6.0-Android-alpha18-debug.apk               > BCIWhisper-v6.0-Android-alpha18-debug.apk.sha256
          )

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BCIWhisper-Android-alpha18
          path: out/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish Alpha 18 GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="android-v6.0-alpha18"
          APK="out/BCIWhisper-v6.0-Android-alpha18-debug.apk"
          HASH="out/BCIWhisper-v6.0-Android-alpha18-debug.apk.sha256"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$HASH"               --clobber               --repo "${{ github.repository }}"
          else
            gh release create "$TAG" "$APK" "$HASH"               --repo "${{ github.repository }}"               --target "${{ github.sha }}"               --title "BCIWhisper Android v6.0 Alpha 18"               --notes "BCIAndroid Alpha 18 native-engine build. Developer Seal: CJB-DEV-2026."
          fi
